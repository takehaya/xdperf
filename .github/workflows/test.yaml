---
name: test

on:
  push:
    paths:
      - 'go.*'
      - '**.go'
      - '**.h'
      - '**.c'
      - 'Makefile'
      - 'plugins/vxlan.c/**'
      - '.github/workflows/test.yaml'

jobs:
  build:
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    steps:
      - name: check out
        uses: actions/checkout@v5
      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod
          cache: false
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y make clang lld
      - name: install build tools
        run: make install-build-tools
      - name: test buildable
        run: |
          make build
          test -s out/bin/vxlan.c.wasm
      - name: test pass init() phase of all packages
        run: make test-runnable
  test:
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    steps:
      - name: check out
        uses: actions/checkout@v4
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
      - name: install C plugin build dependencies
        run: sudo apt-get update && sudo apt-get install -y make clang lld
      - name: build C plugin for integration tests
        run: |
          make -C plugins/vxlan.c
          test -s out/bin/vxlan.c.wasm
      - name: Build mixed variant plugin for integration tests
        run: make make_outdir mixed.go
      - name: go test
        run: go test -exec "sudo -E" -race -covermode=atomic -coverprofile=coverage.out -v ./...
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
