---
# The upstream vimto images (ghcr.io/cilium/ci-kernels) ship without
# CONFIG_SCHED_EXT, so the sched_ext scheduler is tested against a
# purpose-built kernel (ci-kernels config + SCHED_CLASS_EXT + VETH). The
# kernel build is cached on the build script + base config, so it only
# reruns when the kernel recipe changes.
name: scx load test

on:
  push:
    paths:
      - 'go.*'
      - '**.go'
      - '**.h'
      - '**.c'
      - 'pkg/scx/**'
      - 'scripts/scx_kernel/**'
      - '.github/workflows/scx_load_test.yaml'
  pull_request:
    paths:
      - 'go.*'
      - '**.go'
      - '**.h'
      - '**.c'
      - 'pkg/scx/**'
      - 'scripts/scx_kernel/**'
      - '.github/workflows/scx_load_test.yaml'

jobs:
  scx-load-test:
    name: scx load test (sched_ext kernel)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VIMTO_VERSION: v0.4.0
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - name: Cache vimto binary
        uses: actions/cache@v4
        id: vimto-cache
        with:
          path: ~/go/bin/vimto
          key: vimto-bin-${{ runner.os }}-${{ env.VIMTO_VERSION }}

      - name: Install vimto
        if: steps.vimto-cache.outputs.cache-hit != 'true'
        run: CGO_ENABLED=0 go install lmb.io/vimto@${{ env.VIMTO_VERSION }}

      - name: Cache QEMU packages
        uses: actions/cache@v4
        id: qemu-cache
        with:
          path: ~/.cache/qemu-debs
          key: qemu-debs-${{ runner.os }}-${{ runner.arch }}

      - name: Install QEMU
        run: |
          if [ -d ~/.cache/qemu-debs ]; then
            sudo cp ~/.cache/qemu-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          mkdir -p ~/.cache/qemu-debs
          cp /var/cache/apt/archives/qemu*.deb ~/.cache/qemu-debs/ 2>/dev/null || true

      - name: Enable KVM
        run: sudo chmod 0666 /dev/kvm

      - name: Cache sched_ext test kernel
        uses: actions/cache@v4
        id: kernel-cache
        with:
          path: out/scx-kernel
          key: scx-kernel-${{ hashFiles('scripts/scx_kernel/build.sh', 'scripts/scx_kernel/config-base-6.18') }}

      - name: Build sched_ext test kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: ./scripts/scx_kernel/build.sh

      - name: Run scx load test
        run: vimto -kernel "$PWD/out/scx-kernel/bzImage" -smp 2 -- go test -v -count 1 -timeout 5m ./pkg/scx/ -run TestScx
